services:
  db:
    build:
      context: ./mysql
    container_name: mecaniqa-mysql
    environment:
      MYSQL_ROOT_PASSWORD: mecaniqa_root
      MYSQL_DATABASE: mecaniqa
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - mecaniqa_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pmecaniqa_root"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    build:
      context: ./redis
    container_name: mecaniqa-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - mecaniqa_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  api:
    build:
      context: ./api
    container_name: mecaniqa-api
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: mecaniqa
      DB_USER: root
      DB_PASSWORD: mecaniqa_root
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mecaniqa_network

volumes:
  mysql_data:
  redis_data:

networks:
  mecaniqa_network:
    driver: bridge
